plugins {
    id 'com.android.application'
}

// ---- Which NDK, CMake and build tools to use: the newest suitable ones installed
// in the Android SDK, unless gradle.properties or -P names one (vibNdkVersion,
// vibCmakeVersion, vibBuildTools). Android Studio's SDK Manager installs them.

def sdkDir = {
    def props = new Properties()
    def lp = rootProject.file('local.properties')
    if (lp.exists()) lp.withInputStream { props.load(it) }
    def dir = props.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    dir ? new File(dir) : null
}()

def versionParts = { String v -> v.tokenize('.-').collect { it.isInteger() ? it.toInteger() : 0 } }
def versionLess = { String a, String b ->
    def x = versionParts(a), y = versionParts(b)
    for (int i = 0; i < Math.max(x.size(), y.size()); ++i) {
        int p = i < x.size() ? x[i] : 0, q = i < y.size() ? y[i] : 0
        if (p != q) return p < q
    }
    false
}
def newestInstalled = { String folder, String atLeast ->
    def dir = sdkDir ? new File(sdkDir, folder) : null
    def names = (dir?.listFiles() ?: []).findAll { it.isDirectory() }*.name.findAll { !versionLess(it, atLeast) }
    names ? names.sort { a, b -> versionLess(a, b) ? -1 : (versionLess(b, a) ? 1 : 0) }.last() : null
}

def ndkVer = findProperty('vibNdkVersion') ?: newestInstalled('ndk', '26')
def cmakeVer = findProperty('vibCmakeVersion') ?: newestInstalled('cmake', '3.24')
def buildToolsVer = findProperty('vibBuildTools') ?: newestInstalled('build-tools', '36')
if (!cmakeVer) {
    def found = (sdkDir ? new File(sdkDir, 'cmake').listFiles() : null)?.findAll { it.isDirectory() }*.name ?: []
    throw new GradleException("Needs CMake 3.24 or newer in the Android SDK (found: ${found ? found.join(', ') : 'none'}). " +
        'Install it with: sdkmanager "cmake;3.31.6" (in the SDK\'s cmdline-tools), or Android Studio > SDK Manager > SDK Tools > CMake with "Show Package Details" ticked.')
}
if (!ndkVer)
    throw new GradleException('Needs an Android NDK in the Android SDK: Android Studio > SDK Manager > SDK Tools > NDK (Side by side).')

// ---- SDL's Java side (its activity, audio, controllers), from the same SDL release
// the native build uses (apps/common/CMakeLists.txt). Downloaded once, while the
// build is being set up, into build/sdl-java.

def sdlTag = 'release-3.2.26'
def sdlJava = layout.buildDirectory.dir('sdl-java-' + sdlTag).get().asFile
if (!new File(sdlJava, 'org/libsdl/app/SDLActivity.java').exists()) {
    def zip = layout.buildDirectory.file("SDL-${sdlTag}.zip").get().asFile
    if (!zip.exists()) {
        zip.parentFile.mkdirs()
        logger.lifecycle("Downloading SDL ${sdlTag} (its Java side) from GitHub")
        URI.create("https://github.com/libsdl-org/SDL/archive/refs/tags/${sdlTag}.zip").toURL().withInputStream { i ->
            zip.withOutputStream { it << i }
        }
    }
    copy {
        from(zipTree(zip)) { include "SDL-${sdlTag}/android-project/app/src/main/java/**" }
        into sdlJava
        eachFile { f -> f.path = f.path.substring(f.path.indexOf('/java/') + '/java/'.length()) }
        includeEmptyDirs = false
    }
}

android {
    namespace = 'io.github.corriedivitt.vibribbonvr'
    compileSdk = 35
    if (buildToolsVer) buildToolsVersion = buildToolsVer
    ndkVersion = ndkVer

    defaultConfig {
        applicationId = 'io.github.corriedivitt.vibribbonvr'
        minSdk = 29
        targetSdk = 32
        versionCode = 100       // 1.0.0 (task 6.7): major * 100 + minor * 10 + patch
        versionName = '1.0.0'
        ndk { abiFilters 'arm64-v8a' }  // Quest 3 (and the Steam Frame's Android side later); 64-bit phones
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DVIB_BUILD_TESTS=OFF', '-DVIB_BUILD_TOOLS=OFF'
                targets 'vibplay', 'SDL3-shared'  // libmain.so and libSDL3.so
            }
        }
    }

    // Two APKs from one project (owner, session 6): the Quest 3 (headset, OpenXR) and
    // Android phones and tablets (flat, touch controls), each with its own package name,
    // so both can be installed side by side.
    flavorDimensions = ['device']
    productFlavors {
        quest {
            dimension = 'device'
            applicationId = 'io.github.corriedivitt.vibribbonvr'
        }
        flat {
            dimension = 'device'
            applicationId = 'io.github.corriedivitt.vibribbon'
            externalNativeBuild { cmake { arguments '-DVIB_VR=OFF', '-DVIB_ANDROID_FLAT=ON' } }
        }
    }

    // Release signing (task 6.8): the owner's key, outside the repository. android/keystore.properties
    // (not committed) names it: storeFile, storePassword, keyAlias, keyPassword. Without it a
    // release build is signed with the debug key and says so (fine for testing, not to hand out:
    // an APK signed with another key cannot update it).
    def keyFile = rootProject.file('keystore.properties')
    def releaseKey = new Properties()
    if (keyFile.exists()) keyFile.withInputStream { releaseKey.load(it) }
    signingConfigs {
        if (releaseKey.getProperty('storeFile')) {
            owner {
                storeFile = file(releaseKey.getProperty('storeFile'))
                storePassword = releaseKey.getProperty('storePassword')
                keyAlias = releaseKey.getProperty('keyAlias')
                keyPassword = releaseKey.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // Optimised native code even in the debug APK: the headset needs the speed.
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
        }
        release {
            minifyEnabled = false
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
            if (signingConfigs.findByName('owner')) {
                signingConfig = signingConfigs.owner
            } else {
                signingConfig = signingConfigs.debug
                logger.warn('Vib-Ribbon: no android/keystore.properties, so the release APK is signed with the DEBUG key (do not hand it out)')
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file('../../CMakeLists.txt')
            version = cmakeVer
        }
    }

    sourceSets {
        main {
            java.srcDir(sdlJava)
            assets.srcDir("${rootDir}/../docs/notices")  // THIRD_PARTY_NOTICES.txt inside the APK (task 6.3)
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
