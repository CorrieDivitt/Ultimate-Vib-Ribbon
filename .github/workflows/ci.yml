name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install Vulkan SDK (Windows, for the viewer)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
          stripdown: true
      - name: Configure
        run: cmake --preset dev -DVIB_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset dev
      - name: Test (no game data; disc tests are skipped)
        run: ctest --preset dev

  # The Quest 3 standalone build (task 5.1): the APK, built as on the owner's PC
  # (android/gradlew assembleDebug), kept as a download from each run.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/wrapper-validation@v4
      - name: CMake for the Android build (from the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" "build-tools;36.0.0" > /dev/null
      - name: Build the APKs (Quest, and phones and tablets)
        working-directory: android
        run: ./gradlew assembleQuestDebug assembleFlatDebug --no-daemon --stacktrace -PvibNdkVersion=$(basename "$ANDROID_NDK_LATEST_HOME")
      - name: Check the APKs hold the game, SDL and the notices
        run: |
          for apk in android/app/build/outputs/apk/quest/debug/app-quest-debug.apk android/app/build/outputs/apk/flat/debug/app-flat-debug.apk; do
            unzip -l "$apk" > apk.txt
            grep -q 'lib/arm64-v8a/libmain.so' apk.txt
            grep -q 'lib/arm64-v8a/libSDL3.so' apk.txt
            grep -q 'lib/arm64-v8a/libc++_shared.so' apk.txt
            grep -q 'assets/THIRD_PARTY_NOTICES.txt' apk.txt
          done
          # The phone build has no headset in it: no OpenXR loader symbols in its game.
          ! unzip -p android/app/build/outputs/apk/flat/debug/app-flat-debug.apk lib/arm64-v8a/libmain.so | grep -aq XR_KHR_android_create_instance
          unzip -p android/app/build/outputs/apk/quest/debug/app-quest-debug.apk lib/arm64-v8a/libmain.so | grep -aq XR_KHR_android_create_instance
      - uses: actions/upload-artifact@v4
        with:
          name: vib-ribbon-vr-quest-apk
          path: |
            android/app/build/outputs/apk/quest/debug/*.apk
            docs/package/QUEST.txt
            docs/notices/THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vib-ribbon-android-apk
          path: |
            android/app/build/outputs/apk/flat/debug/*.apk
            docs/package/ANDROID.txt
            docs/notices/THIRD_PARTY_NOTICES.txt

  # The Windows download (task 4.16 I): the launcher, Vib-Ribbon.exe (monitor) and Vib-Ribbon VR.exe
  # (headset) with the C++ runtime linked in, a README and the licence, zipped and kept
  # as a download from each run.
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
          stripdown: true
      - name: Configure
        run: cmake --preset package -DVIB_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset package
      - name: Assemble the download
        shell: pwsh
        run: |
          $out = "Ultimate-Vib-Ribbon"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item "build/package/apps/launcher/Vib-Ribbon Launcher.exe", "build/package/apps/game/Vib-Ribbon.exe", "build/package/apps/game/Vib-Ribbon VR.exe" $out
          Copy-Item docs/package/README.txt, docs/notices/THIRD_PARTY_NOTICES.txt, LICENSE $out
          # Only Windows' own DLLs and the GPU driver's Vulkan loader may be needed.
          foreach ($exe in "Vib-Ribbon Launcher.exe", "Vib-Ribbon.exe", "Vib-Ribbon VR.exe") {
            $deps = dumpbin /dependents "$out/$exe" | Select-String '\.dll' | ForEach-Object { $_.ToString().Trim() }
            Write-Host "$exe needs: $($deps -join ', ')"
            if ($deps -match '(?i)vcruntime|msvcp|sdl3|openxr') { throw "$exe needs a DLL that is not shipped" }
          }
          Get-ChildItem $out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-vib-ribbon-windows
          path: Ultimate-Vib-Ribbon
